services:
  - type: web
    name: cloudsov-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render derives the public URL from `name` above (https://<name>.onrender.com)
      # unless that name was already taken, in which case update this to match
      # the actual frontend URL shown in the Render dashboard.
      - key: FRONTEND_URL
        value: https://cloudsov-frontend.onrender.com

  - type: web
    name: cloudsov-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Same caveat as above, mirrored for the API's own name.
      - key: VITE_API_URL
        value: https://cloudsov-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
